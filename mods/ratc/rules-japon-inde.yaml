# Pouvoir japonais : guerre électronique, porté par son propre bâtiment.
JPEW:
	Inherits: ^RatcPowerCenter
	RenderSprites:
		Image: jpew
	Buildable:
		Queue: Building
		BuildPaletteOrder: 142
		BuildLimit: 1
		Prerequisites: dome, ~structures.japan, ~techlevel.medium
		Description: Centre de guerre électronique des forces d'autodéfense.\nNécessite de l'électricité. 1 exemplaire maximum.\n  Pouvoir : brouillage électronique japonais
	Valued:
		Cost: 1500
	Tooltip:
		Name: Centre de guerre électronique
	Health:
		HP: 110000
	Armor:
		Type: Wood
	Power:
		Amount: -120
	SpawnActorPower@JPEW:
		OrderName: JapanEW
		PauseOnCondition: disabled || jammed
		IconImage: jpew
		Icon: power-icon
		ChargeInterval: 5250
		Name: Brouillage électronique japonais
		Description: Brouille une zone de 7 cases pendant 20 secondes :\nportée des unités ennemies réduite de 40 %,\ntirs moins précis et verrouillage plus long.\nRévèle la zone et les unités furtives (drones compris).\nAucun dégât.
		Actor: camera.jpew
		LifeTime: 500
		EffectImage: explosion
		DisplayRadarPing: true
		AllowUnderShroud: true
		SelectTargetSpeechNotification: SelectTarget
		InsufficientPowerSpeechNotification: InsufficientPower
		SelectTargetTextNotification: Sélectionnez la zone à brouiller.
		InsufficientPowerTextNotification: Énergie insuffisante.
		EndChargeTextNotification: Brouillage japonais prêt.
		SupportPowerPaletteOrder: 76

# Zone de brouillage : réduit la portée (jp-ew) et dégrade le ciblage (ecm,
# même effet que le drone Aladin) des ennemis présents ; révèle les unités furtives.
camera.jpew:
	Inherits: CAMERA
	EditorOnlyTooltip:
		Name: (Japanese EW proxy)
	RevealsShroud:
		Range: 7c0
	DetectCloaked:
		Range: 7c0
	ProximityExternalCondition@RANGE:
		Condition: jp-ew
		Range: 7c0
		ValidRelationships: Enemy
	ProximityExternalCondition@ECM:
		Condition: ecm
		Range: 7c0
		ValidRelationships: Enemy
	WithRangeCircle@JPEW:
		Type: jpew
		Range: 7c0
		Color: 60A0FF80
		Visible: Always

# Unités sous brouillage japonais : portée réduite de 40 %.
^Vehicle:
	ExternalCondition@JPEW:
		Condition: jp-ew
	RangeMultiplier@JPEW:
		RequiresCondition: jp-ew
		Modifier: 60

^Infantry:
	ExternalCondition@JPEW:
		Condition: jp-ew
	RangeMultiplier@JPEW:
		RequiresCondition: jp-ew
		Modifier: 60

^Ship:
	ExternalCondition@JPEW:
		Condition: jp-ew
	RangeMultiplier@JPEW:
		RequiresCondition: jp-ew
		Modifier: 60

