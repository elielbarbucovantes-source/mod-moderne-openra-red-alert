# =====================================================================
# JAPON ET INDE
# Chargé après rules.yaml (qui définit ^Vehicle, ^Infantry, ^RatcDrone,
# ^RatcPowerCenter...). Factions, drapeaux et voix : ww3/factions.yaml et
# ww3/faction-voices.yaml, générés par tools/ww3-import/ww3factions.py.
#
# Japon : « je gagne grâce à l'information, la précision et la mobilité ».
# Inde : « je gagne grâce à la polyvalence, au volume et à la saturation ».
# Aucune des deux n'a à la fois le meilleur char, la meilleure artillerie,
# le meilleur drone et le meilleur pouvoir de soutien.
# =====================================================================

# =====================================================================
# JAPON — Précision, technologie et défense mobile
# =====================================================================
# Type 10 : char de mobilité. Plus rapide et moins résistant que le Leopard ;
# à longue distance (au-delà de 4 cases), son conduite de tir lui donne un
# obus plus puissant contre les blindés : tirer, se déplacer, tirer ailleurs.
TYPE10:
	Inherits: ^TrackedVehicle
	Inherits@GAINSEXPERIENCE: ^GainsExperience
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	RenderSprites:
		Image: type10
	Buildable:
		Queue: Vehicle
		BuildPaletteOrder: 242
		Prerequisites: dome, ~vehicles.japan, ~techlevel.high
		Description: Char de combat japonais, rapide et très précis.\nTourelle très vive : tire en roulant.\nÀ plus de 4 cases : obus longue portée plus puissant contre les blindés.\nMoins résistant qu'un Leopard.\n  Fort contre : véhicules\n  Faible contre : infanterie, aviation
	Valued:
		Cost: 1700
	Tooltip:
		Name: Type 10
		GenericName: Tank
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Health:
		HP: 60000
	Armor:
		Type: Heavy
	Mobile:
		TurnSpeed: 12
		Speed: 88
	RevealsShroud:
		MinRange: 4c0
		Range: 7c0
		RevealGeneratedShroud: False
	RevealsShroud@GAPGEN:
		Range: 4c0
	Turreted:
		TurnSpeed: 28
		Offset: -43,0,0
	# Premier armement utilisable : l'obus longue portée (entre 4 et 6,75 cases),
	# sinon l'obus standard au contact.
	Armament@LONG:
		Weapon: Type10GunLong
		Recoil: 128
		RecoilRecovery: 38
		LocalOffset: 860,0,150
		MuzzleSequence: muzzle
	Armament@CLOSE:
		Weapon: Type10Gun
		Recoil: 128
		RecoilRecovery: 38
		LocalOffset: 860,0,150
		MuzzleSequence: muzzle
	AttackTurreted:
	WithMuzzleOverlay:
	WithSpriteTurret:
	SpawnActorOnDeath:
		Actor: TYPE10.Husk
	ProducibleWithLevel:
		Prerequisites: vehicles.upgraded
	Selectable:
		DecorationBounds: 1194, 1194
	WithProductionIconOverlay:
		Types: Veterancy
		Prerequisites: vehicles.upgraded

