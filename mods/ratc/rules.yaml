# --- Camion de ravitaillement : transport de troupes non armé, toutes factions ---
# Capacité 15 : infanterie = 1, véhicule = 5 (voir ^Vehicle ci-dessous)
# => 15 fantassins, OU 3 véhicules, OU un mélange (ex. 1 véhicule + 10 fantassins).
RAVIT:
	Inherits: ^Vehicle
	Inherits@selection: ^SelectableSupportUnit
	Inherits@CARGOPIPS: ^CargoPips
	RenderSprites:
		Image: ravit
	Buildable:
		Queue: Vehicle
		BuildPaletteOrder: 415
		Prerequisites: ~techlevel.low
		Description: Camion de transport non armé.\nTransporte 15 fantassins ou 3 véhicules.\n  Non armé\n  Vulnérable sans escorte
	Valued:
		Cost: 100
	Tooltip:
		Name: Camion de ravitaillement
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Health:
		HP: 15000
	Armor:
		Type: Light
	Mobile:
		Speed: 113
		PauseOnCondition: notmobile || being-captured
	RevealsShroud:
		Range: 5c0
	Cargo:
		Types: Infantry, Vehicle
		MaxWeight: 15
		LoadingCondition: notmobile
		EjectOnDeath: true
	WithCargoPipsDecoration:
		PipCount: 15
	# Pas de camion dans un camion (sinon 3 camions pleins = 45 fantassins dans un seul).
	# Il reste transportable par le navire de débarquement (LST).
	Passenger:
		CargoType: SupplyTruck
		Weight: 5

# Un véhicule occupe 5 places (un fantassin en occupe 1).
^Vehicle:
	Passenger:
		Weight: 5
	# Moral : un équipage démoralisé (TOS-1A) roule et tire deux fois moins vite.
	ExternalCondition@DEMORALIZED:
		Condition: demoralized
	SpeedMultiplier@DEMORALIZED:
		RequiresCondition: demoralized
		Modifier: 50
	ReloadDelayMultiplier@DEMORALIZED:
		RequiresCondition: demoralized
		Modifier: 200
	# Brouillage SAS : vision réduite de moitié.
	ExternalCondition@JAMMED:
		Condition: jammed
	RevealsShroudMultiplier@JAMMED:
		RequiresCondition: jammed
		Modifier: 50
	# Désignation laser (drone Luna) : +25 % de dégâts reçus, losange vert visible par l'ennemi.
	ExternalCondition@DESIGNATED:
		Condition: laser-designated
	DamageMultiplier@DESIGNATED:
		RequiresCondition: laser-designated
		Modifier: 125
	WithDecoration@DESIGNATED:
		Image: lasermark
		Sequence: idle
		Palette: chrome
		Position: Top
		ValidRelationships: Enemy
		RequiresCondition: laser-designated
	# Brouillage ECM (drone Aladin) : tirs moins précis, verrouillage plus long, vision réduite.
	ExternalCondition@ECM:
		Condition: ecm
	InaccuracyMultiplier@ECM:
		RequiresCondition: ecm
		Modifier: 150
	ReloadDelayMultiplier@ECM:
		RequiresCondition: ecm
		Modifier: 115
	RevealsShroudMultiplier@ECM:
		RequiresCondition: ecm
		Modifier: 75
	# Appui du drone Patroller : repérage des cibles, +15 % de portée.
	ExternalCondition@DRONESUPPORT:
		Condition: drone-support
	RangeMultiplier@DRONESUPPORT:
		RequiresCondition: drone-support
		Modifier: 115

