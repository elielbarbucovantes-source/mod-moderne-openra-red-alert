# Munition rôdeuse Colibri / Larinae : produite à l'héliport, peu chère.
# Tourne en l'air au-dessus de la zone ; sur ordre d'attaque, fonce sur la cible
# (le drone devient le projectile) et explose. Autonomie : 2 minutes.
COLIBRI:
	Inherits: ^Plane
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	RenderSprites:
		Image: colibri
	Buildable:
		Queue: Aircraft
		BuildPaletteOrder: 58
		Prerequisites: ~aircraft.france, ~techlevel.medium
		Description: Munition rôdeuse (drone kamikaze).\nTourne au-dessus de la zone, puis fonce sur la cible\ndésignée et explose. Usage unique, autonomie 2 minutes.\nFrappe par le dessus : ignore le blindage réactif.\n  Fort contre : blindés légers, artillerie, bâtiments\n  Faible contre : chars lourds, défense antiaérienne
	Valued:
		Cost: 400
	Tooltip:
		Name: Munition rôdeuse Colibri
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Health:
		HP: 800
	RevealsShroud:
		Range: 5c0
		Type: GroundPosition
	Armament:
		Weapon: ColibriDive
	AttackAircraft:
		FacingTolerance: 128
		PersistentTargeting: false
		OpportunityFire: False
	Aircraft:
		CruiseAltitude: 1536
		TurnSpeed: 24
		Speed: 230
		RepulsionSpeed: 40
		MaximumPitch: 90
	AutoTarget:
		InitialStance: HoldFire
		InitialStanceAI: ReturnFire
	Selectable:
		Bounds: 1024, 1024
		DecorationBounds: 1024, 1024
	-EjectOnDeath:
	-SpawnActorOnDeath:
	# Au tir, le drone disparaît : c'est lui qui part vers la cible.
	GrantConditionOnAttack@DIVE:
		Condition: dived
		RevokeDelay: 1000
	KillsSelf@DIVE:
		RequiresCondition: dived
		RemoveInstead: true
	# Batterie épuisée au bout de 2 minutes : il s'écrase.
	KillsSelf@ENDURANCE:
		Delay: 3000
	Explodes:
		Weapon: UnitExplodeHeli
		EmptyWeapon: UnitExplodeHeli

# =====================================================================
# ALLEMAGNE — Pontage tactique rapide (pouvoir du Pionierzentrum, voir plus haut)
# Pont flottant en croix de 5 travées dans chaque direction, posé uniquement
# sur une rivière ou un plan d'eau. Chaque travée transforme sa case en
# terrain « Bridge » : blindés et véhicules passent. Dure 90 s ou jusqu'à
# sa destruction (chaque travée peut être détruite séparément).
# =====================================================================
^TacBridgeSegment:
	Interactable:
	HiddenUnderFog:
		Type: CenterPosition
	Tooltip:
		Name: Pont tactique
	Immobile:
		OccupiesSpace: false
	ChangesTerrain:
		TerrainType: Bridge
	BodyOrientation:
		QuantizedFacings: 1
	RenderSprites:
		Image: tacbridge
	Health:
		HP: 20000
	Armor:
		Type: Concrete
	HitShape:
	Targetable:
		TargetTypes: GroundActor, Structure
	KillsSelf:
		Delay: 2250
		RemoveInstead: true
	Explodes:
		Weapon: SmallBuildingExplode
		EmptyWeapon: SmallBuildingExplode

tacbridge.ns:
	Inherits: ^TacBridgeSegment
	WithSpriteBody:
		Sequence: ns

tacbridge.ew:
	Inherits: ^TacBridgeSegment
	WithSpriteBody:
		Sequence: ew

tacbridge.center:
	Inherits: ^TacBridgeSegment
	WithSpriteBody:
		Sequence: c
	FreeActor@1:
		Actor: tacbridge.ns
		SpawnOffset: 0,-1
	FreeActor@2:
		Actor: tacbridge.ns
		SpawnOffset: 0,1
	FreeActor@3:
		Actor: tacbridge.ew
		SpawnOffset: -1,0
	FreeActor@4:
		Actor: tacbridge.ew
		SpawnOffset: 1,0
	FreeActor@5:
		Actor: tacbridge.ns
		SpawnOffset: 0,-2
	FreeActor@6:
		Actor: tacbridge.ns
		SpawnOffset: 0,2
	FreeActor@7:
		Actor: tacbridge.ew
		SpawnOffset: -2,0
	FreeActor@8:
		Actor: tacbridge.ew
		SpawnOffset: 2,0

