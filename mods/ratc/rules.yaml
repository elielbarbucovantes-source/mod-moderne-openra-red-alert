# =====================================================================
# MORAL : suppression (BMPT, Challenger 3) et démoralisation (TOS-1A)
# =====================================================================
^Infantry:
	# Brouillage SAS : vision réduite de moitié.
	ExternalCondition@JAMMED:
		Condition: jammed
	RevealsShroudMultiplier@JAMMED:
		RequiresCondition: jammed
		Modifier: 50
	# Désignation laser (drone Luna) : +25 % de dégâts reçus, losange vert visible par l'ennemi.
	ExternalCondition@DESIGNATED:
		Condition: laser-designated
	DamageMultiplier@DESIGNATED:
		RequiresCondition: laser-designated
		Modifier: 125
	WithDecoration@DESIGNATED:
		Image: lasermark
		Sequence: idle
		Palette: chrome
		Position: Top
		ValidRelationships: Enemy
		RequiresCondition: laser-designated
	# Brouillage ECM (drone Aladin) : tirs moins précis, verrouillage plus long, vision réduite.
	ExternalCondition@ECM:
		Condition: ecm
	InaccuracyMultiplier@ECM:
		RequiresCondition: ecm
		Modifier: 150
	ReloadDelayMultiplier@ECM:
		RequiresCondition: ecm
		Modifier: 115
	RevealsShroudMultiplier@ECM:
		RequiresCondition: ecm
		Modifier: 75
	ExternalCondition@SUPPRESSED:
		Condition: suppressed
	ExternalCondition@DEMORALIZED:
		Condition: demoralized
	SpeedMultiplier@SUPPRESSED:
		RequiresCondition: suppressed
		Modifier: 50
	ReloadDelayMultiplier@SUPPRESSED:
		RequiresCondition: suppressed
		Modifier: 150
	SpeedMultiplier@DEMORALIZED:
		RequiresCondition: demoralized
		Modifier: 30
	FirepowerMultiplier@DEMORALIZED:
		RequiresCondition: demoralized
		Modifier: 50

# Blindés lourds : peuvent être marqués par l'AWACS ukrainien (surbrillance orange).
^TrackedVehicle:
	ExternalCondition@SPOTTED:
		Condition: awacs-spotted
	WithColoredOverlay@SPOTTED:
		RequiresCondition: awacs-spotted
		Color: FF800070
	# Réticule clignotant, visible seulement par le joueur qui a lancé l'AWACS.
	WithDecoration@AWACS:
		Image: awacsmark
		Sequence: idle
		Palette: chrome
		Position: Top
		ValidRelationships: Enemy
		RequiresCondition: awacs-spotted
		BlinkInterval: 8
		BlinkPattern: On, Off

