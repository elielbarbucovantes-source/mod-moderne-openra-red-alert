# =====================================================================
# Blindage réactif (ERA) : les missiles antichar classiques ne font que
# 10 % de dégâts sur une cible dont l'ERA est encore intact (T-90M, BMPT).
# Les armes à attaque par le toit (NLAW, FPV) redéfinissent ERA: 100.
# =====================================================================
^AntiGroundMissile:
	Warhead@1Dam: SpreadDamage
		Versus:
			ERA: 10

