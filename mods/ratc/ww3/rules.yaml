# ---- Copies privées des modèles modifiés par WW3 (utilisées seulement par les unités WW3)

^WW3Base_Defense:
	Inherits: ^Defense
	Inherits@WW3I1: ^Stealthable
	Capturable@2:
		RequiresCondition: !build-incomplete
		Types: building-external
	RequiresBuildableArea:
		AreaTypes: building
		Adjacent: 4

^WW3Base_Building:
	Inherits: ^Building
	Inherits@WW3I1: ^Stealthable
	Capturable@2:
		RequiresCondition: !build-incomplete
		Types: building-external

^WW3Base_Infantry:
	Inherits: ^Infantry
	Inherits@WW3I1: ^AffectsPROC
	Inherits@WW3I2: ^PropagandaInf
	Inherits@WW3I3: ^ToxInf

^WW3Base_Vehicle:
	Inherits: ^Vehicle
	Inherits@WW3I1: ^Stealthable
	Inherits@WW3I2: ^AffectsPROC
	Inherits@WW3I3: ^PropagandaVeh
	Carryable:
		LocalOffset: 0,0,205
	Crushable:
		CrushClasses: tank
		WarnProbability: 0
		RequiresCondition: !invulnerability
	WithParachute:
		Image: maxichute
		Sequence: idle
		OpeningSequence: open
		Offset: 0,0,304
		RequiresCondition: parachute
	ProductionCostMultiplier:
		Multiplier: 90
		Prerequisites: indp
		Queue: Vehicle
	ProductionTimeMultiplier:
		Multiplier: 85
		Prerequisites: indp
		Queue: Vehicle

^WW3Base_Ship:
	Inherits: ^Ship
	Inherits@WW3I1: ^Stealthable

^WW3Base_Husk:
	Inherits: ^Husk
	Targetable:
		TargetTypes: GroundActor, Husk, NoAutoTarget
		RequiresForceFire: false

# ---- Nouvelles unités, bâtiments et modèles WW3

^Stealthable:
	Cloak@STEALTHABLE:
		InitialDelay: 0
		CloakDelay: 30
		IsPlayerPalette: true
		RequiresCondition: stealth
	TimedConditionBar@STEALTH:
		Condition: stealth
		Color: FF54D1
	ExternalCondition@STEALTH:
		Condition: stealth

^AffectsPROC: #ercc
	ProximityExternalCondition@cloak:
		Condition: cloak
		ValidRelationships: enemy, neutral, ally
		Range: 1c512
		RequiresCondition: !moving
	GrantConditionOnMovement@proc:
		Condition: moving

^CommandoSkull:
	WithDecoration@COMMANDOSKULL:
		Image: pips
		Sequence: pip-skull
		Palette: effect
		Position: TopLeft
		ValidRelationships: Ally, Enemy, Neutral

^IsHoverTank:
	Hovers:
		BobDistance: -35
	WithShadow:
		Offset: 43, 128, 0
		ZOffset: -129
		RequiresCondition: !stealth
	GrantConditionOnTerrain@ONWATER:
		TerrainTypes: Water
		Condition: onwater
	Targetable@ONWATER:
		TargetTypes: Water, Ship
		RequiresCondition: onwater
	LeavesTrails:
		Image: twake
		Palette: effect
		TerrainTypes: Water
		TrailWhileStationary: true
		StationaryInterval: 18
		MovingInterval: 6

^LightPowerArmour:
	SpeedMultiplier@LPA:
		Modifier: 110
	DamageMultiplier@LPA:
		Modifier: 90

^HeavyPowerArmour:
	InaccuracyMultiplier@HPA:
		Modifier: 90
	SpeedMultiplier@HPA:
		Modifier: 90
	DamageMultiplier@HPA:
		Modifier: 80
	GivesExperienceMultiplier@HPA:
		Modifier: 120

^ToxInf:
	ExternalCondition@TOXIN:
		Condition: poisoned
	WithDecoration@TOXIN:
		Image: pips
		Sequence: pip-toxin
		Palette: effect
		Position: TopRight
		Margin: -1, -1
		ValidRelationships: Enemy, Neutral, Ally
		RequiresCondition: poisoned
	ChangesHealth@TOXIN:
		RequiresCondition: poisoned
		Step: -350
		Delay: 15
		StartIfBelow: 100
	SpawnActorOnDeath:
		Actor: Zombie
		Probability: 50
		OwnerType: InternalName
		InternalOwner: Creeps
		RequiresCondition: poisoned

^Propaganda:
	ExternalCondition@PROPAGANDA:
		Condition: prop
	RangeMultiplier@PROP:
		RequiresCondition: prop
		Modifier: 110
	FirepowerMultiplier@PROP:
		RequiresCondition: prop
		Modifier: 130
	DamageMultiplier@PROP:
		RequiresCondition: prop
		Modifier: 75

^PropagandaVeh:
	Inherits: ^Propaganda
	WithDecoration@PROP:
		Image: pips
		Sequence: pip-prop
		Palette: effect
		Position: TopRight
		Margin: -1, -1
		ValidRelationships: Ally
		RequiresCondition: prop
		BlinkInterval: 30
		BlinkPattern: Off, On
	ChangesHealth@PROP:
		RequiresCondition: prop && damaged
		Step: 250
		Delay: 50
		StartIfBelow: 90
	WithDecoration@PROPHEAL:
		Image: pips
		Sequence: fix
		Position: BottomRight
		Margin: 17, 4
		RequiresCondition: prop && damaged
		BlinkInterval: 32
		BlinkPattern: Off, On

^PropagandaInf:
	Inherits: ^Propaganda
	WithDecoration@PROP:
		Image: pips
		Sequence: pip-prop-inf
		Palette: effect
		Position: TopRight
		Margin: -1, -1
		ValidRelationships: Ally
		RequiresCondition: prop
		BlinkInterval: 30
		BlinkPattern: Off, On
	ChangesHealth@PROP:
		RequiresCondition: prop && damaged && !hospitalheal
		Step: 200
		Delay: 50
		StartIfBelow: 90
	WithDecoration@PROPHEAL:
		Image: pips
		Sequence: medic
		Position: BottomRight
		Margin: 17, 4
		RequiresCondition: prop && damaged && !hospitalheal
		BlinkInterval: 32
		BlinkPattern: Off, On

