# Nouvelles factions issues de la carte WW3 (USA, Espagne, Chine, Turquie, Grèce).

^BaseWorld:
	Faction@usa:
		Name: USA
		InternalName: usa
		Side: Allies
		Description: USA : puissance aérienne\nUnités spéciales : A-10, F-22, Apache, Humvee
	Faction@spain:
		Name: Espagne
		InternalName: spain
		Side: Allies
		Description: Espagne : prismes et antigravité\nUnités spéciales : char prisme, canon à prisme
	Faction@china:
		Name: Chine
		InternalName: china
		Side: Soviet
		Description: Chine : maîtres des blindés\nUnités spéciales : chars lourds, tour de propagande
	Faction@turkey:
		Name: Turquie
		InternalName: turkey
		Side: Soviet
		Description: Turquie : subversion et armes chimiques\nUnités spéciales : lance-Scud, Katioucha
	Faction@greece:
		Name: Grèce
		InternalName: greece
		Side: Soviet
		Description: Grèce : infanterie en armure avancée\nUnités spéciales : hoplites, Titan
	Faction@randomallies:
		RandomFactionMembers: england, france, germany, usa, spain
	Faction@randomsoviet:
		RandomFactionMembers: russia, ukraine, china, turkey, greece

World:
	StartingUnits@mcvonly:
		Factions: allies, england, france, germany, soviet, russia, ukraine, usa, spain, china, turkey, greece
	StartingUnits@lightallies:
		Factions: allies, england, france, germany, usa, spain
