# Nouvelles factions : USA, Espagne, Chine, Turquie, Grèce (carte WW3), Japon et Inde (ratc).
# Généré par tools/ww3-import/ww3factions.py.

^BaseWorld:
	Faction@usa:
		Name: USA
		InternalName: usa
		Side: Allies
		Description: USA : puissance aérienne\nUnités spéciales : A-10, F-22, Apache, Humvee
	Faction@spain:
		Name: Espagne
		InternalName: spain
		Side: Allies
		Description: Espagne : prismes et antigravité\nUnités spéciales : char prisme, canon à prisme
	Faction@china:
		Name: Chine
		InternalName: china
		Side: Soviet
		Description: Chine : maîtres des blindés\nUnités spéciales : chars lourds, tour de propagande
	Faction@turkey:
		Name: Turquie
		InternalName: turkey
		Side: Soviet
		Description: Turquie : subversion et armes chimiques\nUnités spéciales : lance-Scud, Katioucha
	Faction@greece:
		Name: Grèce
		InternalName: greece
		Side: Soviet
		Description: Grèce : infanterie en armure avancée\nUnités spéciales : hoplites, Titan
	Faction@japan:
		Name: Japon
		InternalName: japan
		Side: Allies
		Description: Japon : précision, technologie et mobilité\nUnités spéciales : Type 10, Type 16, Type 19, SeaGuardian
	Faction@india:
		Name: Inde
		InternalName: india
		Side: Soviet
		Description: Inde : polyvalence, volume et saturation\nUnités spéciales : Arjun, Nag, Dhanush, TAPAS
	Faction@randomallies:
		RandomFactionMembers: england, france, germany, usa, spain, japan
	Faction@randomsoviet:
		RandomFactionMembers: russia, ukraine, china, turkey, greece, india

